<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Result Review - Literary Heroines</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300;1,6..72,400&family=Poppins:wght@200;300;400;500&display=swap"
    />
    <style>
      :root {
        --paper: oklch(0.965 0.012 80);
        --ink: oklch(0.28 0.025 95);
        --ink-soft: oklch(0.42 0.028 95);
        --muted-foreground: oklch(0.48 0.025 95);
        --border: oklch(0.86 0.018 90);
        --sage-deep: oklch(0.55 0.035 130);
        --font-serif: "Newsreader", serif;
        --font-sans: "Poppins", ui-sans-serif, system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 8% 0%, rgb(122 139 99 / 0.18), transparent 27rem),
          linear-gradient(180deg, rgb(250 247 240), rgb(239 230 211));
        color: var(--ink);
        font-family: var(--font-sans);
        font-weight: 300;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .review-shell {
        width: min(100%, 80rem);
        margin: 0 auto;
        padding: clamp(2rem, 6vw, 5rem) 1.5rem;
      }

      .brand {
        display: inline-block;
        font-family: var(--font-serif);
        letter-spacing: 0.28em;
        line-height: 1.12;
        text-transform: uppercase;
      }

      .brand span {
        display: block;
        color: var(--sage-deep);
        font-size: 0.85rem;
        font-style: italic;
        letter-spacing: 0.18em;
        text-transform: none;
      }

      .eyebrow {
        margin: clamp(3rem, 8vw, 5rem) 0 0;
        color: var(--sage-deep);
        font-size: 0.72rem;
        letter-spacing: 0.3em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 52rem;
        margin: 1.2rem 0 0;
        font-family: var(--font-serif);
        font-size: clamp(3.25rem, 7vw, 6rem);
        font-weight: 300;
        line-height: 0.94;
      }

      h1 em {
        color: rgb(123 83 68);
        font-style: italic;
      }

      .intro {
        max-width: 42rem;
        margin: 1.7rem 0 0;
        color: var(--muted-foreground);
        font-family: var(--font-serif);
        font-size: 1.15rem;
        line-height: 1.7;
      }

      .result-grid {
        display: grid;
        gap: 1rem;
        margin-top: clamp(2rem, 5vw, 3.5rem);
      }

      .result-card {
        border: 1px solid rgb(77 62 42 / 0.12);
        background: rgb(255 252 245 / 0.72);
        padding: 1.25rem;
        transition: transform 180ms ease, border-color 180ms ease, background-color 180ms ease;
      }

      .result-card:hover {
        border-color: rgb(77 62 42 / 0.28);
        background: rgb(255 252 245 / 0.92);
        transform: translateY(-2px);
      }

      .result-name {
        margin: 0;
        font-family: var(--font-serif);
        font-size: 2rem;
        font-weight: 300;
        line-height: 1;
      }

      .result-meta {
        margin: 0.6rem 0 0;
        color: var(--muted-foreground);
        font-family: var(--font-serif);
        font-style: italic;
      }

      .result-link {
        display: inline-flex;
        gap: 0.75rem;
        margin-top: 1rem;
        color: var(--ink-soft);
        font-size: 0.7rem;
        font-weight: 400;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }

      @media (min-width: 720px) {
        .result-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <main class="review-shell">
      <a class="brand" href="index.html">
        Literary
        <span>Heroines</span>
      </a>

      <p class="eyebrow">Result Review</p>
      <h1>Review every <em>full chapter</em></h1>
      <p class="intro">
        Use these links to open each live result page with the new summary, full chapter,
        pull quotes, portrait, and end-of-page actions.
      </p>

      <section class="result-grid" id="resultGrid" aria-label="Result preview links"></section>
    </main>

    <script type="module">
      import { QUIZ_CHARACTERS } from "./assets/quiz-data.js";
      import { RESULT_DETAILS } from "./assets/result-details.js?v=20260606-results-copy";

      const slugs = {
        0: "elizabeth-bennet",
        1: "jane-bennet",
        2: "emma-woodhouse",
        3: "anne-elliot",
        4: "marianne-dashwood",
        5: "elinor-dashwood",
        6: "jane-eyre",
        7: "catherine-earnshaw",
        8: "jo-march",
      };

      document.getElementById("resultGrid").innerHTML = QUIZ_CHARACTERS.map((heroine) => {
        const detail = RESULT_DETAILS[heroine.id];
        return `
          <a class="result-card" href="quiz.html?result=${slugs[heroine.id]}">
            <h2 class="result-name" style="color:${heroine.cl}">${heroine.n}</h2>
            <p class="result-meta">${detail.meta}</p>
            <span class="result-link">Open Result <span aria-hidden="true">→</span></span>
          </a>
        `;
      }).join("");
    </script>
  </body>
</html>
